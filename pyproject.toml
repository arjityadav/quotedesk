[project]
name = "quotedesk"
version = "0.1.0"
description = "AI quoting agent for industrial distribution (synthetic data only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "lxml>=5.3",
    "psycopg[binary]>=3.2",
    "alembic>=1.20.1",
]

[project.scripts]
quotedesk = "quotedesk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotedesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: needs a running PostgreSQL (set DATABASE_URL); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["quotedesk"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true
