# Alembic CLI config. Use `make migrate`, or load .env yourself:
#   uv run --env-file .env alembic current | history | upgrade head | downgrade -1
# The database URL comes from DATABASE_URL (see .env.example), not from this file.

[alembic]
script_location = %(here)s/src/quotedesk/db/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
